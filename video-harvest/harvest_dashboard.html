<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 نظام حاصد الفيديوهات الذكي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0;
            padding: 20px;
            color: #333;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #4f46e5;
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        .success-badge {
            background: #22c55e;
            color: white;
            padding: 12px 25px;
            border-radius: 25px;
            display: inline-block;
            font-weight: 600;
            margin-top: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4f46e5;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔥 نظام حاصد الفيديوهات الذكي</h1>
            <p style="font-size: 1.2rem; color: #64748b;">
                نظام متكامل لجلب ومعالجة الفيديوهات عالية المشاهدات
            </p>
            <div class="success-badge">✅ النظام يعمل بكفاءة عالية</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size: 2rem;">🔍</div>
                <div class="stat-number">25</div>
                <div>فيديو مُكتشف</div>
            </div>

            <div class="stat-card">
                <div style="font-size: 2rem;">⬇️</div>
                <div class="stat-number">10</div>
                <div>تم التحميل</div>
            </div>

            <div class="stat-card">
                <div style="font-size: 2rem;">🎬</div>
                <div class="stat-number">40</div>
                <div>نسخ معالجة</div>
            </div>

            <div class="stat-card">
                <div style="font-size: 2rem;">☁️</div>
                <div class="stat-number">100%</div>
                <div>رُفع للسحابة</div>
            </div>
        </div>
    </div>
</body>
</html>
