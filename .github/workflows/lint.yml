name: Lint docs and configs
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: "lint-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ibiqlik/action-yamllint@v5
        with:
          format: github
          strict: true
          file_or_dir: ".github/**/*.yml"