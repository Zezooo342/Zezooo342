name: 🔥 Professional Video Harvester

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Harvester
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          NICHE: تطوير الذات
          TARGET_PLATFORMS: tiktok,youtube,instagram,facebook
        run: python smart_page_creator.py

      - name: Show Results
        run: |
          echo "Files in ready_to_publish:"
          ls intelligent_harvest/ready_to_publish || echo "لا توجد ملفات"
          echo "Dashboard:"
          cat intelligent_harvest/analytics/dashboard.html || echo "لا يوجد لوحة"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: harvest-results
          path: intelligent_harvest/
          if-no-files-found: warn
