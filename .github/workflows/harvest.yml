name: 🔥 Harvest Viral Videos
on:
  push: { branches: [ main, master ] }
  schedule: [{ cron: '0 */6 * * *' }]
  workflow_dispatch:
    inputs:
      niche:
        description: 'مجال التخصص'
        required: false
        default: 'تطوير الذات'
      platforms:
        description: 'منصات (مفصولة بفواصل)'
        required: false
        default: 'tiktok,youtube'
jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with: { python-version: '3.9' }
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # تثبيت صريح لضمان توفر moviepy
        pip install moviepy
    - name: |
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TIKTOK_MIN_VIEWS: ${{ secrets.TIKTOK_MIN_VIEWS }}
          YOUTUBE_MIN_VIEWS: ${{ secrets.YOUTUBE_MIN_VIEWS }}
          MAX_VIDEO_AGE_DAYS: ${{ secrets.MAX_VIDEO_AGE_DAYS }}
          TARGET_PLATFORMS: ${{ secrets.TARGET_PLATFORMS }}
          NICHE: ${{ secrets.NICHE }}
        run: python smart_page_creator.py
      - uses: actions/upload-artifact@v4
        with:
          name: harvest-results
          path: intelligent_harvest/
          if-no-files-found: warn
      - uses: peaceiris/actions-gh-pages@v3
        if: startsWith(github.ref, 'refs/heads/')
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./intelligent_harvest
          destination_dir: video-harvest
