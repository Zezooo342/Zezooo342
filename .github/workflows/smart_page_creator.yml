name: 🔥 Viral Video Intelligence - نظام اكتشاف الفيديوهات الرائجة

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      niche:
        description: 'مجال التخصص (مثل: تطوير الذات)'
        required: false
        default: 'تطوير الذات وريادة الأعمال'

jobs:
  analyze-viral-content:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout الكود
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 📦 تثبيت المكتبات
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 تشغيل نظام اكتشاف الفيديوهات الرائجة
      env:
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        NICHE: ${{ github.event.inputs.niche || 'تطوير الذات وريادة الأعمال' }}
      run: |
        python smart_page_creator.py

    - name: 📊 رفع نتائج التحليل
      uses: actions/upload-artifact@v4
      with:
        name: viral-content-analysis
        path: viral_content/

    - name: 🌐 Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./viral_content
        destination_dir: viral-analysis
