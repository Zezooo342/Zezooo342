name: 🔥 Intelligent Video Harvester - نظام حاصد الفيديوهات الذكي

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      niche:
        description: 'مجال التخصص (مثل: تطوير الذات)'
        required: false
        default: 'تطوير الذات وريادة الأعمال'
      platforms:
        description: 'المنصات المستهدفة (مفصولة بفواصل)'
        required: false
        default: 'tiktok,youtube'

jobs:
  harvest-viral-videos:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout الكود
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: 🎬 تثبيت FFmpeg لمعالجة الفيديو
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: 📦 تثبيت المكتبات المطلوبة
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🔥 تشغيل نظام حاصد الفيديوهات الذكي
      env:
        PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        NICHE: ${{ github.event.inputs.niche || 'تطوير الذات وريادة الأعمال' }}
        TARGET_PLATFORMS: ${{ github.event.inputs.platforms || 'tiktok,youtube' }}
      run: |
        python smart_page_creator.py

    - name: 📊 رفع نتائج الحصاد
      uses: actions/upload-artifact@v4
      with:
        name: intelligent-harvest-results
        path: Drive/intelligent_harvest/

    - name: 🌐 Deploy Dashboard to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./intelligent_harvest
        destination_dir: video-harvest
