name: Viral Video Pipeline
on:
  schedule:
    - cron: '0 3 * * *'  # كل يوم الساعة 3 صباحًا UTC
jobs:
  run_pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install yt-dlp moviepy pytube google-api-python-client facebook-sdk requests
      - name: Run pipeline
        run: python pipeline.py  # سكربتك الشامل
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add results/*.json
          git commit -m "Update results"
          git push
